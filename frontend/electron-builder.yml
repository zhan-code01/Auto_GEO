appId: com.autogeo.app
productName: AutoGeo
copyright: Copyright © 2025 AutoGeo Team
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  # Include production node_modules (electron-builder auto-resolves dependencies from package.json)
  - node_modules/**/*
  # Exclude unnecessary files from node_modules
  - "!**/node_modules/*/{TEST,test,tests,__tests__,example,examples}/**"
  - "!**/node_modules/*.md"
  - "!**/node_modules/*.ts"
  - "!**/node_modules/*.map"
  - "!**/node_modules/.bin/**"
extraResources:
  - from: ../backend
    to: backend
    filter:
      - '**/*'
      - '!**/__pycache__'
      - '!**/*.pyc'
      - '!**/.pytest_cache'
      - '!**/tests'
      - '!**/.git'
      - '!**/venv'
      - '!**/node_modules'
      - '!**/*.egg-info'
      - '!**/data/**'
      - '!**/logs/**'
      - '!**/database/**'
      - '!**/.env'
      - '!**/.env.*'
      - '!**/build/**'
      - '!**/dist/**'
  # 单独打包 scripts/dist 目录下的 exe 文件（worker 和 publisher runner）
  # electron-builder 的 **/* 有时不会递归复制 dist 目录下的二进制文件，需要显式声明
  - from: ../backend/scripts/dist
    to: backend/scripts/dist
    filter:
      - '**/*.exe'
      - '**/*.exe.manifest'
# 关闭 asar 打包，避免模块路径问题（实测这玩意儿是个坑）
asar: false
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: AutoGeo
mac:
  target:
    - target: dmg
      arch:
        - x64
  category: public.app-category.productivity
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  contents:
    - x: 130
      'y': 220
      type: file
      path: AutoGeo.app
    - x: 410
      'y': 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
  synopsis: AI-powered multi-platform article publishing assistant
deb:
  priority: optional

# 备注（2026-02-26）：禁用publish功能（不需要自动更新）
# 如果需要启用自动更新，需要配置完整的Git仓库或添加repository字段到package.json
publish: null
